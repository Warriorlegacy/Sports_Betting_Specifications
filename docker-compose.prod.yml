version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sports_exchange_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exchange_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exchange_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-sports_exchange}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./services/backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./services/backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exchange_admin} -d ${POSTGRES_DB:-sports_exchange}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - exchange_network

  redis:
    image: redis:7-alpine
    container_name: sports_exchange_redis_prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-exchange_redis_pwd_2026}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-exchange_redis_pwd_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - exchange_network

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: sports_exchange_backend_prod
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-exchange_admin}:${POSTGRES_PASSWORD:-exchange_secure_password_2026}@postgres:5432/${POSTGRES_DB:-sports_exchange}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-exchange_redis_pwd_2026}
      JWT_SECRET: ${JWT_SECRET:-super_secure_production_sports_exchange_jwt_key_2026}
      COMMISSION_RATE: ${COMMISSION_RATE:-0.02}
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - exchange_network

  matching-engine:
    build:
      context: ./services/matching-engine
      dockerfile: Dockerfile
    container_name: sports_exchange_matching_engine_prod
    restart: always
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-exchange_redis_pwd_2026}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - exchange_network

  agent-portal:
    build:
      context: ./services/agent-portal
      dockerfile: Dockerfile
    container_name: sports_exchange_agent_portal_prod
    restart: always
    ports:
      - "${AGENT_PORTAL_PORT:-3000}:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - exchange_network

  player-portal:
    build:
      context: ./services/player-portal
      dockerfile: Dockerfile
    container_name: sports_exchange_player_portal_prod
    restart: always
    ports:
      - "${PLAYER_PORTAL_PORT:-3001}:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - exchange_network

volumes:
  pgdata_prod:
    name: sports_exchange_pgdata_prod
  redisdata_prod:
    name: sports_exchange_redisdata_prod

networks:
  exchange_network:
    name: sports_exchange_network
    driver: bridge
