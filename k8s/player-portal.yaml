apiVersion: apps/v1
kind: Deployment
metadata:
  name: player-portal
  namespace: sports-exchange
  labels:
    app: player-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: player-portal
  template:
    metadata:
      labels:
        app: player-portal
    spec:
      containers:
        - name: player-portal
          image: ghcr.io/your-org/sports-exchange-player-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: player-portal-service
  namespace: sports-exchange
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: player-portal
