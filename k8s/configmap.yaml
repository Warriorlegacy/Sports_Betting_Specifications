apiVersion: v1
kind: ConfigMap
metadata:
  name: sports-exchange-config
  namespace: sports-exchange
data:
  NODE_ENV: "production"
  PORT: "5000"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  COMMISSION_RATE: "0.02"
  SIMULATOR_ENABLED: "true"
  POSTGRES_DB: "sports_exchange"
  POSTGRES_USER: "exchange_admin"
