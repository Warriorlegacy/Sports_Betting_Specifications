plugins {
    id 'com.android.application' version '8.2.2' apply false
}

apply plugin: 'com.android.application'

android {
    namespace 'com.nexusvip.exchange'
    compileSdk 34

    defaultConfig {
        applicationId "com.nexusvip.exchange"
        minSdk 24
        targetSdk 34
        versionCode 200
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }
}
