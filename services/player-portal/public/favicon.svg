<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a20" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176" />
      <stop offset="35%" stop-color="#ffb74d" />
      <stop offset="70%" stop-color="#f36c21" />
      <stop offset="100%" stop-color="#d84315" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f36c21" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffd54f" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f36c21" stop-opacity="0.9" />
    </linearGradient>
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="16" />

  <!-- Subtle inner neon perimeter -->
  <rect x="42" y="42" width="428" height="428" rx="92" fill="none" stroke="#f36c21" stroke-opacity="0.2" stroke-width="4" stroke-dasharray="16 8" />

  <!-- Ambient Glow Behind Bolt -->
  <path d="M 290 64 L 140 275 L 260 275 L 222 448 L 372 220 L 252 220 Z" fill="#f36c21" opacity="0.4" filter="url(#boltGlow)" />

  <!-- Main Energy Bolt -->
  <path d="M 290 64 L 140 275 L 260 275 L 222 448 L 372 220 L 252 220 Z" fill="url(#boltGrad)" />

  <!-- Glass / Sheen Highlight on Left -->
  <path d="M 290 64 L 210 275 L 260 275 L 230 400 L 285 240 L 252 220 Z" fill="#ffffff" opacity="0.28" />

  <!-- Crown / Star Accent Dot -->
  <circle cx="390" cy="120" r="14" fill="#ffe082" />
</svg>
