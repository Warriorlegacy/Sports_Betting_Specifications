services:
  # -------------------------------------------------------------
  # 1. Node.js Backend API & Real-Time WebSockets Gateway
  # -------------------------------------------------------------
  - type: web
    name: sports-exchange-backend
    env: node
    plan: free
    region: oregon
    rootDir: services/backend
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: COMMISSION_RATE
        value: "0.02"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Paste your Neon.tech or Supabase connection string
      - key: REDIS_URL
        sync: false # Paste your Upstash Redis connection string
      - key: SIMULATOR_ENABLED
        value: "true"
