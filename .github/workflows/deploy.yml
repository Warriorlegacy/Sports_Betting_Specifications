name: Build & Deploy Sports Exchange

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  test-and-lint:
    name: Run Test Suites & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Backend Integration Tests
        run: |
          cd services/backend
          npm ci || npm install
          npm test

      - name: Matching Engine Unit Tests
        run: |
          cd services/matching-engine
          npm ci || npm install
          npm test

  build-and-push:
    name: Build & Push Production Docker Images
    needs: test-and-lint
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest,${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}

      - name: Build and push Matching Engine Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/matching-engine
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/matching-engine:latest,${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/matching-engine:${{ github.sha }}

      - name: Build and push Agent Portal Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/agent-portal
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/agent-portal:latest,${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/agent-portal:${{ github.sha }}

      - name: Build and push Player Portal Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/player-portal
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/player-portal:latest,${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/player-portal:${{ github.sha }}

  deploy-kubernetes:
    name: Deploy to Kubernetes Cluster
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kubeconfig
        if: env.KUBECONFIG_DATA != ''
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config

      - name: Apply Kubernetes Resources
        if: env.KUBECONFIG_DATA != ''
        run: |
          kubectl apply -k k8s/
          kubectl rollout status deployment/backend -n sports-exchange --timeout=120s
          kubectl rollout status deployment/player-portal -n sports-exchange --timeout=120s
          kubectl rollout status deployment/agent-portal -n sports-exchange --timeout=120s
